# Atualizações automáticas de dependências (abre PRs; o CI roda os testes).
# Avisos de segurança do GitHub geram PRs à parte, a qualquer momento.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # Patches e minors juntos: menos PRs, e o CI garante que nada quebrou.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Saltos de versão MAIOR (ex.: TypeScript 5 -> 7, ESLint 9 -> 10, SDK da
      # Anthropic 0.x -> 1.x) mudam comportamento e são feitos à mão, um por vez,
      # com testes e conferência (ver CLAUDE.md). O Dependabot cuida de minor e patch.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
